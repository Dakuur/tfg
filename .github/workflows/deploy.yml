name: Auto Deploy CVC

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 2. Configurar Entorn Virtual
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

      - name: 3. Actualitzar Dependències (Opcional)
        # S'executa si poses "[update]" al commit o si el venv és nou (no té torch)
        if: contains(github.event.head_commit.message, '[update]') || hashFiles('venv/lib/*/site-packages/torch/__init__.py') == ''
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install torch-geometric
          pip install -r requirements.txt
          pip install fastapi "uvicorn[standard]"

      - name: 4. Aturar Procés Anterior
        run: |
          pkill -f alive_test.py || true
          pkill -f "uvicorn frontend.main" || true

      - name: 5. Executar Aplicació
        run: |
          source venv/bin/activate
          export RUNNER_TRACKING_ID=0
          nohup python -u alive_test.py > log.txt 2>&1 &
          nohup uvicorn frontend.main:app --host 0.0.0.0 --port 8000 > log_frontend.txt 2>&1 &

      - name: 6. Verificar Estat de l'Arrencada
        run: |
          sleep 5
          if pgrep -f alive_test.py > /dev/null; then
            echo "✅ L'aplicació s'està executant correctament."
            echo "Últims logs:"
            tail -n 10 log.txt
          else
            echo "❌ ERROR: L'aplicació ha fallat en arrencar."
            cat log.txt
            exit 1
          fi
          echo "Frontend logs:"
          tail -n 5 log_frontend.txt || true
name: Auto Deploy CVC

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 1b. Inicialitzar submoduls
        run: |
          git config submodule.pt1diagnosis.url git@github.com:IAM-CVC/PT1Diagnosis.git
          # Si el submòdul ja existeix al runner, descarta qualsevol edició local
          # (mai hauria d'haver-hi feina en curs allà — el runner ha d'estar prístí).
          if [ -d pt1diagnosis/.git ] || [ -f pt1diagnosis/.git ]; then
            git -C pt1diagnosis reset --hard HEAD || true
            git -C pt1diagnosis clean -fd       || true
          fi
          git submodule update --init --force --recursive

      - name: 2. Configurar Entorn Virtual
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

      - name: 3. Actualitzar Dependències (Opcional)
        # S'executa si poses "[update]" al commit o si el venv és nou (no té torch)
        if: contains(github.event.head_commit.message, '[update]') || hashFiles('venv/lib/*/site-packages/torch/__init__.py') == ''
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.5.1+cu118.html
          pip install torch-geometric
          pip install -r requirements.txt
          pip install fastapi "uvicorn[standard]"

      - name: 4. Reiniciar frontend
        run: |
          # Matar qualsevol uvicorn nohup que pugui estar ocupant el port
          pkill -f "uvicorn frontend.main" || true
          sleep 1
          # Intenta via systemd (si frontend/setup_service.sh s'ha executat manualment)
          if sudo systemctl restart histogat-frontend 2>/dev/null; then
            echo "✅ histogat-frontend reiniciat via systemd"
            systemctl is-active histogat-frontend || true
          else
            # Fallback: nohup (fins que es configuri el servei systemd)
            echo "⚠️  systemd no disponible — usant nohup com a fallback"
            echo "   Per activar el servei persistent, executa al servidor:"
            echo "   sudo bash frontend/setup_service.sh"
            pkill -f "uvicorn frontend.main" || true
            sleep 1
            source venv/bin/activate
            export RUNNER_TRACKING_ID=0
            nohup uvicorn frontend.main:app --host 0.0.0.0 --port 8000 > log_frontend.txt 2>&1 &
            sleep 3
            if pgrep -f "uvicorn frontend.main" > /dev/null; then
              echo "✅ Frontend iniciat via nohup (port 8000)"
            else
              echo "❌ Frontend no ha arrencat"
              cat log_frontend.txt
              exit 1
            fi
          fi

      - name: 5. Verificar entorn Python
        run: |
          source venv/bin/activate
          python -c "import torch; from torch_geometric.data import Data; device = 'cuda' if torch.cuda.is_available() else 'cpu'; print(f'torch={torch.__version__}, device={device}, pyg OK')"
          echo ""
          echo "Frontend URL: http://$(hostname -I | awk '{print $1}'):8000"

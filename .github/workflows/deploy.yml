name: Auto Deploy CVC

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout del codi
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 2. Configurar Entorn Virtual
        run: |
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

      - name: 3. Actualitzar Dependències (Opcional)
        # S'executa si poses "[update]" al commit o si el venv és nou (no té torch)
        if: contains(github.event.head_commit.message, '[update]') || hashFiles('venv/lib/*/site-packages/torch/__init__.py') == ''
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install torch-geometric
          pip install -r requirements.txt
          pip install fastapi "uvicorn[standard]"

      - name: 4. Instal·lar servei systemd (si no existeix)
        # Primera vegada, o si s'esborra el servei manualment
        run: |
          if ! systemctl is-active --quiet histogat-frontend 2>/dev/null && \
             ! systemctl is-enabled --quiet histogat-frontend 2>/dev/null; then
            echo "Servei no trobat — instal·lant..."
            sudo bash scripts/setup_service.sh
          else
            echo "Servei ja instal·lat — s'actualitzarà a continuació"
          fi

      - name: 5. Aturar alive_test anterior
        run: |
          pkill -f alive_test.py || true

      - name: 6. Reiniciar frontend via systemd
        run: |
          sudo systemctl restart histogat-frontend
          sleep 3
          if systemctl is-active --quiet histogat-frontend; then
            echo "✅ histogat-frontend actiu"
          else
            echo "❌ histogat-frontend ha fallat"
            journalctl -u histogat-frontend -n 30 --no-pager
            exit 1
          fi

      - name: 7. Executar alive_test
        run: |
          source venv/bin/activate
          export RUNNER_TRACKING_ID=0
          nohup python -u alive_test.py > log.txt 2>&1 &

      - name: 8. Verificar Estat de l'Arrencada
        run: |
          sleep 5
          if pgrep -f alive_test.py > /dev/null; then
            echo "✅ alive_test s'està executant correctament."
            tail -n 10 log.txt
          else
            echo "❌ ERROR: alive_test ha fallat en arrencar."
            cat log.txt
            exit 1
          fi
          echo ""
          echo "Frontend URL: http://$(hostname -I | awk '{print $1}'):8000"

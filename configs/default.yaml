# HistoGAT — Training Configuration
#
# Any scalar value can be replaced by a list to trigger a grid search.
# train.py executes one run per combination.
#
# Recommended usage with k-fold CV:
#   python train.py --kfold 5 --run_name exp_grid
#
# Current grid: 2 poolings × 2 aggregations × 2 lr = 8 combos
# With --kfold 5 → 40 total runs

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  graphs_dir:     "outputs/graphs"
  checkpoint_dir: "outputs/checkpoints"

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  hidden:  128
  heads:   4
  dropout: 0.5

  # Readout pooling strategy:
  #   mean_max — concat(global_mean_pool, global_max_pool)  [GAT Baseline]
  #   diff     — Hierarchical DiffPool (N → K1 → K2)       [GAT+DiffPool]
  pooling:       ["mean_max", "diff"]
  diff_clusters: 25     # K1; K2 = max(K1//3, 5) = 8

# ── Training ───────────────────────────────────────────────────────────────────
training:
  lr:           [1.0e-4, 1.0e-5]
  weight_decay: 1.0e-3
  epochs:       100
  batch_size:   32

  # ReduceLROnPlateau
  scheduler_factor:   0.5
  scheduler_patience: 5
  scheduler_min_lr:   1.0e-6

  warm_up:  10
  patience: 15
  seed:     123

  # Metric used for checkpointing
  monitor: "val_auc"

  # Patient-level MIL training (recommended)
  patient_level: true

  # Per-slide aggregation → patient probability:
  #   noisy_or  — probabilistic OR (P=1-Π(1-p_i))
  #   attention — Gated Attention MIL (Ilse et al., 2018)
  aggregation: ["noisy_or", "attention"]

# ── W&B ────────────────────────────────────────────────────────────────────────
wandb:
  project:  "colon-cancer-gnn"
  run_name: null        # null → W&B auto-generates a name

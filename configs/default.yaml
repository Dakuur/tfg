# HistoGAT — Training Configuration
#
# Any scalar value can be replaced by a list to run a grid search.
# train.py will execute one training run per combination.
#
# Current grid: 4 poolings × 5 aggregations × 2 lr × 2 monitors = 80 runs
# Fixed from prior experiments: hidden=128, heads=2, dropout=0.5, diff_clusters=25

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  graphs_dir:     "outputs/graphs"
  checkpoint_dir: "outputs/checkpoints"

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  hidden:  128
  heads:   2
  dropout: 0.5

  # Readout pooling strategy (str or list):
  #   mean_max — concat(global_mean_pool, global_max_pool)
  #   mean     — global_mean_pool
  #   max      — global_max_pool
  #   sum      — global_add_pool
  #   diff     — Differential Hierarchical Pooling (DiffPool)
  pooling:       ["mean", "mean_max", "sum", "diff"]
  diff_clusters: 25     # only used if pooling=diff

# ── Training ───────────────────────────────────────────────────────────────────
training:
  lr:         [1.0e-4, 1.0e-5]
  epochs:     100
  batch_size: 128

  # ReduceLROnPlateau
  scheduler_factor:   0.5
  scheduler_patience: 5
  scheduler_min_lr:   1.0e-6

  warm_up:  10
  patience: 15
  seed:     123

  # Metric used for checkpointing:
  #   val_auc      — validation ROC-AUC
  #   val_f1_macro — macro-averaged F1 (N0 + N1)
  monitor: ["val_auc", "val_f1_macro"]

  patient_level: true

  # How to aggregate per-slide P(N1) → patient probability:
  #   noisy_or — P(pat=N1) = 1 - Π(1-P(slide_i))  [default]
  #   max      — max(P(slide_i))
  #   lse      — log-sum-exp smooth maximum
  #   mean     — mean(P(slide_i))
  #   attention — Gated Attention MIL (Ilse et al., 2018)
  aggregation: ["noisy_or", "max", "lse", "mean", "attention"]

# ── W&B ────────────────────────────────────────────────────────────────────────
wandb:
  project:  "colon-cancer-gnn"
  run_name: null        # null → W&B auto-generates a name

# W&B Sweep — HistoGAT hyperparameter search
#
# Method: bayes (Gaussian-process Bayesian optimisation)
# Metric: val/auc (maximise)
# Early termination: Hyperband (kills unpromising runs after min_iter epochs)
#
# Usage:
#   # Create sweep + run 1 agent (prints sweep ID):
#   python train.py --sweep
#
#   # Add more agents to an existing sweep (run in parallel on multiple machines):
#   python train.py --sweep_id <id> --sweep_count 5
#
# Fixed across all trials (set in configs/default.yaml):
#   epochs, warm_up, patience, seed, patient_level, graphs_dir, checkpoint_dir

method: bayes

metric:
  name: val/auc
  goal: maximize

# Hyperband: stop trials that fall below the best runs after `min_iter` epochs.
# min_iter matches the warm_up in default.yaml so early-stop and Hyperband align.
early_terminate:
  type: hyperband
  min_iter: 15
  eta: 2        # halving factor — keeps top 1/eta at each rung

parameters:

  # ── Model ─────────────────────────────────────────────────────────────────
  hidden:
    values: [64, 128, 256]

  heads:
    values: [2, 4]

  dropout:
    distribution: uniform
    min: 0.2
    max: 0.7

  pooling:
    values: ["mean_max", "diff", "mean", "max"]

  diff_clusters:
    # Only matters when pooling=diff; harmless otherwise
    values: [10, 25, 50]

  # ── Training ──────────────────────────────────────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3

  weight_decay:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2

  aggregation:
    values: ["noisy_or", "max", "mean", "attention"]

  batch_size:
    values: [32, 64, 128]
